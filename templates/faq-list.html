<!doctype html>
<html lang="{{ site.language | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ seo.title | default: site.name }}</title>
    <meta name="description" content="{{ seo.description | default: site.description }}">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css"
    >
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
    <link rel="stylesheet" href="{{ 'assets/css/style.css' | asset_url }}">
  </head>
  <body class="theme-theliaison header-layout-text-left-slider-right slider-layout-text-left-slider-right {% if site.topbar.status or topbar.status %}has-topbar {% endif %}atlas-page atlas-page-faq-list">
    {% render 'sections/header.html' %}
    <main>
      <section class="page-hero">
        <div class="container-fluid px-3 px-lg-4">
          <div class="page-hero-shell">
            <span class="eyebrow">FAQs</span>
            <h1>{{ page.title | default: 'Frequently asked questions' }}</h1>
            <p class="lead">{{ page.subtitle }}</p>
          </div>
        </div>
      </section>
      <section class="section">
        <div class="container-fluid px-3 px-lg-4">
          <div class="content-card">
            <div class="faq-list" data-accordion>
              {% for item in faqs %}
                <article class="faq-item {% if forloop.first %}is-open{% endif %}">
                  <button type="button" class="faq-trigger" data-accordion-trigger>
                    <span>{{ item.question }}</span>
                    <i class="ri-add-line"></i>
                  </button>
                  <div class="faq-panel" data-accordion-panel>
                    <div class="rich-content">{{ item.answer }}</div>
                  </div>
                </article>
              {% endfor %}
            </div>
          </div>
        </div>
      </section>
    </main>
    {% render 'sections/footer.html' %}
    {% render 'sections/auxiliaries.html' %}
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script src="{{ 'assets/js/main.js' | asset_url }}" defer></script>
  </body>
</html>
