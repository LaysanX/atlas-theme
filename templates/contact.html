<!doctype html>
<html lang="{{ site.language | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ seo.title | default: 'Contact' }}</title>
    <meta name="description" content="{{ seo.description | default: site.description }}">
    <meta name="keywords" content="{{ seo.keywords | default: site.keywords }}">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css"
    >
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
    <link rel="stylesheet" href="{{ 'assets/css/style.css' | asset_url }}">
  </head>
  <body class="theme-theliaison header-layout-text-left-slider-right slider-layout-text-left-slider-right {% if site.topbar.status or topbar.status %}has-topbar {% endif %}atlas-page atlas-page-contact">
    {% render 'sections/header.html' %}
    <main>
      {% render 'sections/contact-form.html' %}
    </main>
    {% render 'sections/footer.html' %}
    {% render 'sections/auxiliaries.html' %}
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script src="{{ 'assets/js/main.js' | asset_url }}" defer></script>
  </body>
</html>
